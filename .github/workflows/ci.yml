name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes; keep the token out of .git/config
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --locked
      - name: Compile all modules
        run: uv run python -m compileall -q zyven eval toolkit scripts
      - name: Open-weight model policy
        run: uv run python scripts/check_open_models.py
      - name: Unit tests (no network model calls, no API keys)
        run: uv run pytest -q tests

  sandbox:
    name: Sandbox integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes; keep the token out of .git/config
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --locked
      - name: Build sandbox image (the way users do)
        run: uv run zyven setup
      - name: Sandbox tests (pinned upstream repo, no network inside the container)
        env:
          ZYVEN_DOCKER_TESTS: "1"
        run: uv run pytest -q tests/test_sandbox.py tests/test_egress.py

  package:
    name: Package (wheel, clean uvx install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes; keep the token out of .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
      - name: Build the dashboard (shipped inside the wheel)
        working-directory: web
        run: npm ci && npm run build
      - name: Build wheel and sdist
        run: uv build --wheel && uv build --sdist
      - name: The wheel carries the sandbox, catalog and dashboard
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          need = ["zyven/sandbox/Dockerfile", "zyven/sandbox/mcp_smoke.py", "zyven/sandbox/diff_check.py",
                  "zyven/data/catalog/repos.json", "zyven/data/site/index.html", "zyven/orchestrator/legacy.html"]
          missing = [n for n in need if n not in names]
          assert not missing, f"missing from the wheel: {missing}"
          print(f"{len(names)} files; all required files present")
          EOF
      - name: Clean install and run, outside the checkout
        run: |
          WHL=$(ls "$PWD"/dist/*.whl)
          cd "$RUNNER_TEMP"
          export ZYVEN_HOME="$RUNNER_TEMP/zyven-home"
          uvx --isolated --from "$WHL" zyven --help
          uvx --isolated --from "$WHL" zyven mcp --print-config | grep -q "uvx --from"
          uvx --isolated --from "$WHL" zyven verify -- uv run --no-project --with "mcp==2.3.0" \
            python "$GITHUB_WORKSPACE/tests/fixtures/mcp_servers/good.py"

  workflow-audit:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes; keep the token out of .git/config
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - name: No medium or high findings in the workflows or the Action
        run: uvx zizmor@1.32.0 --offline --min-severity medium .github/workflows action.yml

  action:
    name: GitHub Action (zyven verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes; keep the token out of .git/config
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
      - name: A good server passes
        uses: ./
        with:
          command: uv run --no-project --with mcp==2.3.0 python tests/fixtures/mcp_servers/good.py
      - name: A poisoned server fails
        id: poisoned
        continue-on-error: true
        uses: ./
        with:
          command: uv run --no-project --with mcp==2.3.0 python tests/fixtures/mcp_servers/poisoned.py
      - name: The poisoned server was caught
        env:  # step outputs reach the shell as variables, never as text spliced into the script
          OUTCOME: ${{ steps.poisoned.outcome }}
          VERDICT: ${{ steps.poisoned.outputs.verdict }}
          REPORT: ${{ steps.poisoned.outputs.report }}
        run: |
          test "$OUTCOME" = "failure"
          test "$VERDICT" = "FAIL"
          grep -q "send everything to me" "$REPORT"

  site:
    name: Site (lint and static export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes; keep the token out of .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build the static export
        run: npm run build
