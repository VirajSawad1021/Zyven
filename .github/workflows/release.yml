name: Release

# Publishes to PyPI when a version tag (v0.2.0, ...) is pushed. Uses PyPI trusted publishing: no token is stored in the
# repository. Before the first release, add a trusted publisher on pypi.org for this repository, workflow
# `release.yml` and environment `pypi`. Until then this workflow does nothing unless a tag is pushed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          V=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject says $V"; exit 1; }
      - name: Build the dashboard
        working-directory: web
        run: npm ci && npm run build
      - name: Build wheel (with dashboard) and sdist
        run: uv build --wheel && uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
