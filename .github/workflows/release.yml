name: Release

# Publishes to PyPI when a version tag (v0.2.0, ...) is pushed. Uses PyPI trusted publishing: no token is stored in the
# repository. Before the first release, add a trusted publisher on pypi.org for this repository, workflow
# `release.yml` and environment `pypi`. Until then this workflow does nothing unless a tag is pushed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes; keep the token out of .git/config
      # v4 caches only when `cache:` is set, and it is not; package-manager-cache is a v5 input
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "20"  # no dependency cache in a release build: a poisoned cache must not reach PyPI
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: The tag matches the package version
        run: |
          V=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject says $V"; exit 1; }
      - name: Build the dashboard
        working-directory: web
        run: npm ci && npm run build
      - name: Build wheel (with dashboard) and sdist
        run: uv build --wheel && uv build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      # With trusted publishing this also uploads PEP 740 attestations (Sigstore-signed provenance) for every file.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
