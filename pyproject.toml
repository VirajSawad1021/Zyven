[project]
name = "zyven"
version = "0.1.0"
description = "Turn open-source code into verified MCP tools, and check any MCP server before your agent trusts it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "ai-agents", "verification", "sandbox", "tool-poisoning", "codex", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.scripts]
zyven = "zyven.cli:main"

[project.urls]
Homepage = "https://github.com/VirajSawad1021/Zyven"
Repository = "https://github.com/VirajSawad1021/Zyven"
Issues = "https://github.com/VirajSawad1021/Zyven/issues"

[dependency-groups]
# Libraries wrapped by the hand-written baseline skills in toolkit/.
toolkit = [
    "nepali @ git+https://github.com/opensource-nepal/py-nepali@3ff19477150ea597d6ce2e9d3dce62e6cf0065e6",
    "python-stdnum @ git+https://github.com/arthurdejong/python-stdnum@006192e59be8ed6e08fd680256868a6c31eb2ba9",
    "hijridate @ git+https://github.com/dralshehri/hijridate@f6f0f4f69da8e58dc65179213822ef7b83a77dcd",
    "pyluach @ git+https://github.com/simlist/pyluach@c1ffe4265f25ab7f5d850f4720111470f27e7ce5",
    "packaging @ git+https://github.com/pypa/packaging@929fd4b1410ac7ef61ef3f45b2f5d7e87711a9b5",
    "networkx @ git+https://github.com/networkx/networkx@49ca2290b80c1389eb4d8d8e49dcba73f8fec016 ; python_full_version >= '3.12'",  # 3.7 needs Python 3.12+
    "phonenumbers @ git+https://github.com/daviddrysdale/python-phonenumbers@e92147091eca7db103f35cb4daed85376ab79328#subdirectory=python",
]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["toolkit", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zyven"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.wheel.hooks.custom]  # hatch_build.py: the catalog, and the dashboard when built

[tool.hatch.build.targets.sdist]
include = ["zyven", "catalog/repos.json", "hatch_build.py", "README.md", "LICENSE"]
